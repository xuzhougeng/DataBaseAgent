iv>`).join('')}<div class="resource-foot"><span>24 / 64 核已分配</span><span>另有 1 台服务器在线</span></div></div></section></div><section class="card"><div class="card-head"><h2>最近任务 <small>GPSA</small></h2><button class="text-button" onclick="go('jobs')">查看全部 ${I('chevron')}</button></div>${jobsTable(jobRows.slice(0,3))}</section>`:`<section class="card"><div class="card-head"><h2>项目下一步</h2>${badge(p.tag,p.color)}</div><div class="content-pad"><p class="muted">${p.stage===2?'Agent 已完成初步判断，请检查纳入建议及其证据。人工确认后，数据才能进入处理队列。':'先确定数据纳入范围、检索来源和宽范围检索词。检索完成后，Agent 将逐条复核。'}</p>${btn(p.stage===2?'进入数据复核':'配置主题与检索',`go('${p.stage===2?'review':'search'}')`,'primary','arrow')}</div></section>`}<div class="footer-line"><span>${I('lock')} 项目数据保存在本地 · 远程服务器负责计算</span><span>最近更新　今天 14:32</span></div>`}

function reviewPage(){if(st.project>1)return head('EVIDENCE REVIEW','数据复核','Agent 提供判断与证据，最终纳入由你确认。')+`<div class="card empty">尚无待复核记录<br>${btn('先运行主题检索',"go('search')",'small')}</div>`;let filtered=papers.filter((p,i)=>st.filter==='all'||(st.filter==='pending'?!st.decisions[i]:st.decisions[i]===st.filter));if(filtered.length&&!filtered.includes(papers[st.paper]))st.paper=papers.indexOf(filtered[0]);let a=papers[st.paper];return head('EVIDENCE REVIEW','数据复核','Agent 提供判断与证据，最终纳入由你确认。',badge('3 条可操作示例 · 其余为统计占位','gray'))+`<div class="tabs">${[['pending','待确认'],['accepted','已纳入'],['excluded','已排除'],['all','全部记录']].map(([v,n])=>`<button class="tab ${st.filter===v?'active':''}" onclick="st.filter='${v}';render()">${n}</button>`).join('')}</div><div class="review-layout"><div>${filtered.length?filtered.map(p=>{let i=papers.indexOf(p);return `<button class="paper ${st.paper===i?'selected':''}" onclick="st.paper=${i};render()"><div style="display:flex;justify-content:space-between">${badge(st.decisions[i]==='accepted'?'已纳入':st.decisions[i]==='excluded'?'已排除':p.decision,p.decision==='需要确认'?'orange':p.decision==='建议排除'?'gray':'')}<small>${p.id}</small></div><h3>${st.project===1?['Single-cell transcriptome atlas of Arabidopsis roots','Single-nucleus profiling of rice under salt stress','Spatial mapping of leaf development'][i]:p.title}</h3><small>${st.project===1?'植物 · 单细胞候选研究':p.cell+' · '+p.type} · 示例记录</small></button>`}).join(''):'<div class="card empty">这一分类暂无记录。</div>'}</div><div class="card"><div class="card-head"><h2>证据与判断</h2>${badge('Agent 复核')}</div><div class="content-pad"><div class="eyebrow">${a.id} · DEMO DATA</div><h3 style="font-weight:500;font-size:15px;line-height:1.7">${st.project===1?'植物单细胞候选研究':a.title}</h3><div class="tags"><span class="tag">${st.project===1?'植物':a.species}</span><span class="tag">${st.project===1?'RNA 测序':a.n}</span></div><h4 style="font-size:11px;margin-top:25px">Agent 判断 · 置信度${a.confidence}</h4><p class="muted">${st.project===1?'请核实研究是否实际分析了植物单细胞或单核测序数据，原始数据链接及样本元数据是否完整。':a.reason}</p><div class="evidence">${st.project===1?'演示证据：从文章方法和数据可用性声明中提取测序技术、研究对象和数据编号，供用户检查。':a.quote}</div><div class="field"><label>人工备注</label><textarea id="review-note" placeholder="记录纳入理由、排除理由或需补充的信息…" style="min-height:70px">${esc((st.notes||{})[st.paper]||'')}</textarea></div><div class="decision">${btn('确认纳入',"decide('accepted')",'primary','check')}${btn('排除',"decide('excluded')",'','close')}${btn('稍后检查',"deferPaper()",'','clock')}</div><p class="muted" style="font-size:10px;margin-bottom:0">未确认的数据不会进入处理队列。此处文献与证据均为演示。</p></div></div></div>`}
function workflowPage(){return head('PIPELINE BUILDER','定义处理流程','使用你信任的工具，固定流程后交给 Agent 执行。',btn(st.locked?'已锁定 v1.2':'保存并锁定',st.locked?'unlockFlow()':'lockFlow()','primary',st.locked?'lock':'check'))+`<div class="notice" style="background:#f0f6f0;border-color:#e0eade;color:#6d866c">${I('lock')}${st.locked?'当前流程已锁定。Agent 可重试、恢复下载和清理临时文件；更改工具、参考文件或分析参数需要你确认。':'编辑模式：点击步骤调整工具与参数。锁定版本后才能开始运行。'}</div><div class="two-col" style="grid-template-columns:1.4fr 1fr"><div>${[['数据获取','从 GEO / SRA 下载原始数据','down'],['质量控制','过滤低质量序列与接头','review'],['参考基因组比对',st.project===0?'GRCh38 · GENCODE v46':'由用户提供参考文件','flow'],['基因表达定量','生成 gene × sample counts','database'],['差异表达分析','明确分组与对比设计','activity']].map(([t,s,ic],i)=>`<div class="flow-node"><span class="flow-number">${I(ic)}</span><div class="row-main"><strong>${t}</strong><small>${s}</small><code>${esc(st.workflow[i])}</code></div><button class="icon-button" onclick="editStep(${i})" aria-label="编辑${t}">${I(st.locked?'lock':'edit')}</button></div>`).join('')}</div><div><div class="card"><div class="card-head"><h2>运行配置</h2></div><div class="content-pad"><div class="field"><label>执行服务器</label><select id="flow-server" ${st.locked?'disabled':''}><option ${st.flowServer==='gzserver01 · SSH'?'selected':''}>gzserver01 · SSH</option><option ${st.flowServer==='cpu-node02 · Slurm'?'selected':''}>cpu-node02 · Slurm</option></select></div><div class="field"><label>每个任务资源</label><input id="flow-resources" ${st.locked?'disabled':''} value="${esc(st.resources||'8 CPU · 32 GB RAM')}"></div><div class="field"><label>并发任务上限</label><input id="flow-concurrency" type="number" min="1" max="64" ${st.locked?'disabled':''} value="${st.concurrency||4}"></div><p class="muted">资源由多个项目共享。任务超出配额时会排队等待。</p></div></div><div class="card"><div class="card-head"><h2>结果同步策略</h2></div><div class="content-pad"><p class="muted">同步质控报告、表达矩阵、差异分析表与运行记录。</p><div class="tags"><span class="tag">校验文件完整性</span><span class="tag">增量同步</span><span class="tag">保留原始数据于远端</span></div></div></div>${btn('创建处理任务','launchJobs()','primary','play')}</div></div>`}
function jobsTable(rows){return `<div class="table-wrap"><table><thead><tr><th>数据编号</th><th>当前阶段</th><th>状态</th><th>服务器</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><strong class="mono">${r[0]}</strong></td><td>${r[1]}</td><td>${badge(st.issue&&r[2]==='需要协助'?'排队中':r[2],r[2]==='需要协助'&&!st.issue?'orange':r[2]==='运行中'?'blue':'')}</td><td>${r[4]}</td><td><button class="icon-button" onclick="jobDetail(${jobRows.indexOf(r)>=0?jobRows.indexOf(r):i})" aria-label="查看 ${r[0]}">${I('chevron')}</button></td></tr>`).join('')}</tbody></table></div>`}
function jobsPage(){return head('REMOTE EXECUTION','运行任务','远程执行，本地掌握。每一个任务都有完整的运行记录。',btn('调度设置','settings()','','settings'))+stats([['运行中','32','任务','下载 8 · 处理 20 · 同步 4','activity'],['排队中',st.issue?'15':'14','任务','资源空闲后自动提交','clock'],['已完成','128','组','通过校验并归档','check'],['需要协助',st.issue?'0':'1','项',st.issue?'已恢复相关任务':'其他任务不受影响','alert']])+`<div class="toolbar"><div class="tabs" style="margin:0;border:0"><button class="tab active" onclick="filterJobs('all',this)">全部</button><button class="tab" onclick="filterJobs('running',this)">运行中</button><button class="tab" onclick="filterJobs('help',this)">需要协助</button></div><input class="searchbox" placeholder="搜索数据编号…" aria-label="搜索任务" oninput="searchJobs(this.value)"></div><div class="card" id="jobs-table">${jobsTable(jobRows)}</div><p class="muted">任务列表为 4 条代表性示例；上方数字用于展示真实项目中的汇总视图。</p>`}
function serversPage(){return head('COMPUTE RESOURCES','服务器资源','连接你的计算资源，为每个项目分配合适的运行空间。',btn('添加服务器','addServer()','primary','plus'))+`<div class="notice" style="background:#f0f6f0;border-color:#e0eade;color:#6d866c">${I('server')}计算在服务器完成，分析结果同步回本地。跨项目资源配额由调度器统一管理。</div><div class="large-grid">${[{name:'gzserver01',host:'research@gzserver01',mode:'SSH',cpu:64,mem:256,used:64,ram:42},{name:'cpu-node02',host:'research@cpu-node02',mode:'Slurm',cpu:128,mem:512,used:38,ram:28},...st.servers].map((s,i)=>`<section class="server-card"><div class="server-title"><span class="tile-icon">${I('server')}</span>${badge(i<2?'在线 · 示例':'待连接','gray')}</div><h3 style="margin-top:20px">${esc(s.name)}</h3><p class="muted mono">${esc(s.host)}</p><div class="tags"><span class="tag">${s.mode}</span><span class="tag">${s.cpu} CPU</span><span class="tag">${s.mem} GB RAM</span></div>${[['CPU',s.used],['内存',s.ram]].map(([n,v])=>`<div class="meter-row"><span>${n}</span><div class="progress"><i style="width:${v}%"></i></div><b>${v}%</b></div>`).join('')}<div style="display:flex;gap:8px;margin-top:22px">${btn('连接检查',`testServer(${i})`,'small','sync')}${btn('资源分配',`serverQuota(${i})`,'small','settings')}</div></section>`).join('')}</div><section class="card"><div class="card-head"><h2>项目资源配额</h2><small>运行中的任务优先保留资源</small></div><div class="table-wrap"><table><thead><tr><th>项目</th><th>服务器</th><th>CPU 配额</th><th>最大并发</th></tr></thead><tbody><tr><td>GPSA 虚拟扰动</td><td>gzserver01</td><td>${st.quota||'32'} 核</td><td>4</td></tr><tr><td>植物单细胞图谱</td><td>cpu-node02</td><td>64 核</td><td>8</td></tr></tbody></table></div></section>`}
function resultsPage(){return head('LOCAL COLLECTION','数据与产物','把远程计算转化为本地、可追溯、可建库的数据资产。',btn('导出产物清单','exportManifest()','','down'))+stats([['本地数据集','128','组','每组关联原始研究与处理版本','database'],['同步完成','96.9','%','124 / 128 组已完成本次校验','sync'],['本地占用','18.4','GB','仅分析产物，不含原始测序文件','folder'],['待同步','4','组','服务器在线时继续同步','clock']])+`<div class="card"><div class="card-head"><h2>本地结果目录</h2>${btn('同步结果','syncResults()','small','sync')}</div><div class="content-pad"><div class="code">~/DBA/projects/gpsa/results/</div><p class="muted">每份结果包含来源记录、流程版本、参数、日志与完整性校验信息。</p></div><div class="table-wrap"><table><thead><tr><th>产物</th><th>数据集</th><th>大小</th><th>状态</th><th></th></tr></thead><tbody>${[['expression_matrix.tsv','DEMO-0067','24.8 MB'],['differential_expression.tsv','DEMO-0067','3.2 MB'],['qc_report.html','DEMO-0067','1.1 MB'],['run_manifest.json','DEMO-0067','8.2 KB']].map(([n,d,s],i)=>`<tr><td><strong>${I('file')}　${n}</strong></td><td class="mono">${d}</td><td>${s}</td><td>${badge('已校验')}</td><td><button class="text-button" onclick="artifact(${i})">查看</button></td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="card-head"><h2>准备后续数据库构建</h2>${badge('128 组产物可用')}</div><div class="content-pad"><p class="muted">将标准化元数据、表达矩阵和分析结果交给后续数据库应用。DBA 保留数据来源与处理历史，支持按版本重新生成产物。</p><div class="tags"><span class="tag">Metadata</span><span class="tag">Expression matrix</span><span class="tag">Differential expression</span><span class="tag">Provenance</span></div>${btn('查看数据契约','dataContract()','small','database')}</div></div>`}
function agentPage(){return head('AGENT OPERATIONS','Agent 中心','持续检查进展，修复可恢复的问题，在需要判断时向你求助。',btn(st.paused?'恢复巡检':'暂停巡检','toggleAgent()',st.paused?'primary':'',st.paused?'play':'pause'))+`<div class="notice" style="background:#eff6ef;border-color:#e0eade;color:#6b866a">${I('agent')}${st.paused?'自动巡检已暂停，远程任务继续运行。':'每 '+(st.interval||'5 分钟')+'检查任务进度 · 可恢复错误最多重试 '+(st.retries??3)+' 次 · 不自动修改分析方法'}</div><div class="two-col"><section class="card"><div class="card-head"><h2>自主修复范围</h2>${badge('已启用')}</div><div class="content-pad"><p class="muted">✓ 网络中断后恢复下载<br>✓ 临时连接失败后重新连接<br>✓ 校验失败后重新传输结果<br>✓ 保留日志后重试失败步骤</p></div></section><section class="card"><div class="card-head"><h2>需要你的确认</h2>${badge('人工接手','orange')}</div><div class="content-pad"><p class="muted">• 数据纳入与排除<br>• 样本分组与对比设计<br>• 更换工具、参考文件与分析参数<br>• 连续失败或超出资源上限</p></div></section></div><section class="card"><div class="card-head"><h2>求助请求</h2>${badge(st.issue?'已处理':'1 项待处理',st.issue?'':'orange')}</div><div class="content-pad"><h3 style="font-size:14px;font-weight:500">DEMO-0198 · 无法确定对照样本</h3><p class="muted">已检查 GEO 元数据、样本名称及论文附件，仍无法可靠确定 control / treatment 配对。该任务已暂停，其他任务继续。</p>${btn(st.issue?'查看处理记录':'提供分组信息','helpIssue()','small','arrow')}</div></section><section class="card"><div class="card-head"><h2>操作记录</h2><small>全部操作记录原因、动作与结果</small></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>对象</th><th>动作</th><th>结果</th></tr></thead><tbody><tr><td>14:32</td><td>12 组分析产物</td><td>同步并校验</td><td>${badge('成功')}</td></tr><tr><td>14:25</td><td>DEMO-0084</td><td>下载重试 1 / 3</td><td>${badge('已恢复')}</td></tr><tr><td>14:18</td><td>DEMO-0198</td><td>暂停并请求协助</td><td>${badge(st.issue?'已处理':'等待你确认',st.issue?'':'orange')}</td></tr></tbody></table></div></section>`}
function emptyProjectPage(){return head('PROJECT WORKSPACE',st.page==='jobs'?'运行任务':'数据与产物','当前项目尚未开始处理。')+`<section class="card empty">${I('folder')}<p>先完成数据复核并确认处理流程。</p>${btn('配置处理流程',"go('workflow')",'primary','flow')}<p class="muted">切换至 GPSA 项目可查看运行任务与产物示例。</p></section>`}
const pages={overview,projects:allProjects,search:searchPage,review:reviewPage,workflow:workflowPage,jobs:jobsPage,servers:serversPage,results:resultsPage,agent:agentPage};
function toast(t){document.getElementById('toast-root').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(window.tt);window.tt=setTimeout(()=>document.getElementById('toast-root').innerHTML='',4200)}
function modal(title,body,actions=''){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="icon-button" onclick="closeModal()" aria-label="关闭">${I('close')}</button></div><div class="modal-body">${body}</div><div class="modal-actions">${btn('关闭','closeModal()')}${actions}</div></section></div>`;setTimeout(()=>document.querySelector('.modal input,.modal textarea,.modal button')?.focus(),30)}
function closeModal(){document.getElementById('modal-root').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function newProject(){modal('新建数据库项目',`<div class="field"><label>项目名称</label><input id="new-name" placeholder="例如：植物胁迫响应数据库"></div><div class="field"><label>研究目标</label><textarea id="new-desc" placeholder="描述你希望收集的数据与要回答的问题…"></textarea></div><div class="field"><label>项目目录</label><input value="~/DBA/projects/" disabled></div><p class="muted">新项目将从主题与检索开始。服务器与流程可以稍后配置。</p>`,btn('创建项目','createProject()','primary','plus'))}
function createProject(){let n=document.getElementById('new-name').value.trim(),d=document.getElementById('new-desc').value.trim();if(!n){toast('请先填写项目名称');return}let p={name:n,short:n,desc:d||'尚未定义研究目标',tag:'待配置',color:'gray',stage:0,n:0,progress:0};scopeSave();projects.push(p);st.newProjects.push(p);st.project=projects.length-1;scopeLoad(st.project);st.page='search';save();closeModal();render();toast('项目已创建，可继续定义研究范围')}
function projectSettings(){modal('项目设置',`<div class="field"><label>项目名称</label><input id="rename-project" value="${esc(projects[st.project].name)}"></div><div class="field"><label>本地结果目录</label><input value="~/DBA/projects/${st.project===0?'gpsa':'project-'+st.project}/" disabled></div><p class="muted">项目保留独立的检索策略、纳入记录、流程版本及运行历史。</p>`,btn('保存','renameProject()','primary'))}
function renameProject(){let n=document.getElementById('rename-project').value.trim();if(!n)return toast('项目名称不能为空');projects[st.project].name=n;projects[st.project].short=n;save();closeModal();render();toast('项目设置已保存')}
function saveScope(){projects[st.project].desc=document.getElementById('topic').value;['organism','assay','criteria'].forEach(k=>st[k]=document.getElementById(k).value);save();toast('研究范围已保存')}
function saveQuery(){st.query=document.getElementById('query').value;save();toast('检索式已保存')}
function runSearch(){if(!document.getElementById('query').value.trim())return toast('请先填写检索表达式');saveQuery();modal('检索预览',`<p class="muted">以下展示一次宽范围检索的结果组织方式。设计稿不会访问真实文献数据库。</p><div class="code">PubMed → 826 条\nGEO    → 328 条\nSRA    → 214 条\nEurope PMC → 96 条\n\n合并去重 → 1,248 条记录\n新增候选 → 36 条</div><p class="muted">下一步：Agent 提取研究对象、实验设计和数据编号，逐条给出纳入建议。</p>`,btn('查看复核示例',"closeModal();go('review')",'primary','arrow'))}
function searchHistory(){modal('检索历史',`<div class="task-row"><div class="row-main"><strong>v3 · 今天 13:20</strong><small>增加 RNAi、gene expression 同义词 · 1,248 条</small></div>${badge('当前')}</div><div class="task-row"><div class="row-main"><strong>v2 · 11 月 3 日</strong><small>加入 GEO 与 SRA · 1,212 条</small></div></div><div class="task-row"><div class="row-main"><strong>v1 · 11 月 1 日</strong><small>初始主题检索 · 986 条</small></div></div>`)}
function decide(value){if(value==='excluded'&&!document.getElementById('review-note').value.trim()){toast('请填写排除理由，便于后续追溯');return}st.notes=st.notes||{};st.notes[st.paper]=document.getElementById('review-note').value;st.decisions[st.paper]=value;save();let n=papers.findIndex((p,i)=>!st.decisions[i]);if(n>=0)st.paper=n;render();toast(value==='accepted'?'已确认纳入；流程锁定后可创建处理任务':'已排除并记录人工判断')}
function deferPaper(){st.paper=(st.paper+1)%papers.length;render();toast('该记录保持待确认，已切换下一条')}
function unlockFlow(){st.locked=false;save();render();toast('已进入流程编辑模式')}
function lockFlow(){st.flowServer=document.getElementById('flow-server').value;st.resources=document.getElementById('flow-resources').value;st.concurrency=document.getElementById('flow-concurrency').value;st.locked=true;save();render();toast('流程版本已锁定')}
function editStep(i){modal(st.locked?'查看流程步骤':'编辑流程步骤',`<div class="field"><label>工具与版本</label><input id="step-tool" ${st.locked?'disabled':''} value="${esc(st.workflow[i])}"></div><div class="field"><label>参数</label><textarea id="step-params" class="mono" ${st.locked?'disabled':''}>${esc((st.params||{})[i]||['--split-files --threads 8','--thread 8 --detect_adapter_for_pe','--runThreadN 8 --genomeDir /ref/GRCh38','-T 8 -p -a /ref/gencode.v46.gtf','design = ~ condition; contrast = treatment vs control'][i])}</textarea></div><p class="muted">${st.locked?'流程已锁定。回到流程页面解锁后可修改。':'保存后请重新锁定流程版本。运行中的任务继续使用原版本。'}</p>`,st.locked?'':btn('保存步骤',`saveStep(${i})`,'primary'))}
function saveStep(i){let value=document.getElementById('step-tool').value.trim();if(!value)return toast('工具与版本不能为空');st.workflow[i]=value;st.params=st.params||{};st.params[i]=document.getElementById('step-params').value;save();closeModal();render();toast('步骤已更新')}
function launchJobs(){if(!st.locked)return toast('请先保存并锁定处理流程');if(st.project!==0)return toast('该项目尚无可处理的已确认数据；GPSA 项目提供完整执行示例');modal('创建处理任务',`<p class="muted">将已确认纳入且尚未处理的数据提交至远程队列。</p><div class="code">流程：GPSA RNA-seq · v1.2\n服务器：gzserver01\n每任务：${esc(st.resources||'8 CPU · 32 GB RAM')}\n并发上限：${esc(st.concurrency||4)}\n结果目录：~/DBA/projects/gpsa/results/</div><p class="muted">这是交互演示，不会提交真实计算任务。</p>`,btn('查看运行队列',"closeModal();go('jobs');toast('已进入演示任务队列')",'primary','play'))}
function filterJobs(filter,el){document.querySelectorAll('.toolbar .tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('jobs-table').innerHTML=jobsTable(jobRows.filter(r=>filter==='all'||(filter==='running'?r[2]==='运行中':r[2]==='需要协助'&&!st.issue)))}
function searchJobs(q){document.getElementById('jobs-table').innerHTML=jobsTable(jobRows.filter(r=>r[0].toLowerCase().includes(q.toLowerCase())))}
function jobDetail(i){let r=jobRows[i];modal(r[0]+' · 任务详情',`<div class="tags">${badge(r[2],r[2]==='需要协助'?'orange':'')}<span class="tag">${r[4]}</span><span class="tag">流程 v1.2</span></div><p class="muted">当前步骤：${r[1]} · 进度 ${r[3]}</p><div class="code">[14:20:03] Loaded workflow gpsa-rnaseq@1.2\n[14:20:04] Input files checksum: OK\n[14:20:05] Resource allocation: 8 CPU / 32 GB\n${i===3?'[14:20:06] BLOCKED: sample group mapping missing\n[14:20:07] Agent requested human assistance':i===2?'[14:24:33] Analysis completed\n[14:32:00] Output sync and checksum: OK':'[14:20:06] Process started\n[14:32:00] Heartbeat received · running'}</div><p class="muted">运行记录保留输入、工具版本、参数与每次重试原因。</p>`,i===3?btn('处理求助','helpIssue()','primary'):btn('返回任务列表',"closeModal();go('jobs')",'primary'))}
function helpIssue(){modal('需要协助 · 确认样本分组',`<div class="notice" style="margin-bottom:18px">${I('alert')}DEMO-0198 · Agent 无法可靠推断对照关系</div><p class="muted">已尝试读取数据元信息、样本名和附件。为避免产生错误的差异分析，当前任务已暂停。</p><div class="field"><label>提供明确的样本分组（每行：样本编号, 分组）</label><textarea id="sample-groups" class="mono" placeholder="sample_01, control&#10;sample_02, control&#10;sample_03, treatment&#10;sample_04, treatment">${esc(st.groups||'')}</textarea></div><p class="muted">确认后仅恢复这个任务。分析工具与参数保持当前锁定版本。</p>`,btn('确认并恢复任务','resolveIssue()','primary','play'))}
function resolveIssue(){let g=document.getElementById('sample-groups').value.trim();let rows=g.split('\n').map(x=>x.split(',').map(y=>y.trim()));if(rows.length<2||rows.some(x=>x.length!==2||!x[0]||!x[1])||new Set(rows.map(x=>x[1])).size<2){toast('请至少填写两个样本、两个分组，使用“样本编号, 分组”格式');return}st.groups=g;st.issue=true;save();closeModal();render();toast('分组已记录，相关演示任务已恢复排队')}
function addServer(){modal('添加远程服务器',`<div class="field"><label>服务器名称</label><input id="server-name" placeholder="例如 lab-server"></div><div class="field"><label>SSH 地址</label><input id="server-host" placeholder="research@hostname"></div><div class="form-grid"><div class="field"><label>调度方式</label><select id="server-mode"><option>SSH</option><option>Slurm</option></select></div><div class="field"><label>认证方式</label><select><option>本机 SSH 密钥</option><option>SSH Agent</option></select></div></div><p class="muted">此设计稿只保存示例配置，不读取密钥、不连接服务器。真实应用中凭据由本机安全存储管理。</p>`,btn('保存配置','saveServer()','primary'))}
function saveServer(){let name=document.getElementById('server-name').value.trim(),host=document.getElementById('server-host').value.trim();if(!name||!host.includes('@'))return toast('请填写名称及 user@hostname 格式的地址');st.servers.push({name,host,mode:document.getElementById('server-mode').value,cpu:'待检测',mem:'待检测',used:0,ram:0});save();closeModal();render();toast('服务器配置已保存，等待真实应用连接')}
function testServer(i){modal('连接检查 · 演示',`<div class="code">${i<2?'✓ SSH 会话：可用（示例）\n✓ 工作目录：可写（示例）\n✓ 运行环境：已就绪（示例）\n✓ 磁盘空间：充足（示例）':'○ 配置已保存\n○ 等待本地应用连接 SSH\n○ 将检测 CPU、内存、存储和运行环境'}</div><p class="muted">本页面不具备 SSH 功能，没有发起真实连接。</p>`)}
function serverQuota(i){modal('项目资源分配',`<p class="muted">分配给 GPSA 虚拟扰动项目的最大 CPU 核数。</p><div class="field"><label>CPU 配额</label><input id="quota" type="number" min="1" max="128" value="${st.quota||32}"></div><p class="muted">新的配额用于后续调度，不中断正在运行的任务。</p>`,btn('保存配额',"saveQuota()",'primary'))}
function saveQuota(){let n=Number(document.getElementById('quota').value);if(n<1||n>128)return toast('配额需为 1–128');st.quota=n;save();closeModal();render();toast('演示配额已更新')}
function toggleAgent(){st.paused=!st.paused;save();render();toast(st.paused?'已暂停自动巡检，运行中任务继续':'已恢复自动巡检')}
function settings(){modal('偏好设置',`<div class="field"><label>Agent 巡检间隔</label><select id="setting-interval">${['5 分钟','10 分钟','30 分钟'].map(n=>`<option ${st.interval===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>可恢复错误的最大重试次数</label><input id="setting-retries" type="number" min="0" max="10" value="${st.retries??3}"></div><div class="tags"><span class="tag">仅同步分析结果</span><span class="tag">分析方法变更需确认</span></div><p class="muted">这是交互设计稿，巡检、下载与远程执行均为示例。</p>`,btn('保存设置','saveSettings()','primary'))}
function saveSettings(){st.interval=document.getElementById('setting-interval').value;st.retries=document.getElementById('setting-retries').value;save();closeModal();toast('偏好已保存：'+st.interval+'巡检，最多重试 '+st.retries+' 次')}
function sendAgent(){let input=document.getElementById('agent-message'),v=input?.value.trim();if(!v)return;st.message='已记录你的指令：“'+v+'”。这是设计稿演示；真实应用会结合当前项目与任务状态制定下一步操作。';save();render()}
function syncResults(){modal('结果同步 · 演示',`<div class="code">远端分析产物 → 本地项目目录\n\n1. 比较文件清单与大小\n2. 增量传输结果文件\n3. 校验 SHA-256\n4. 更新本地索引与运行清单\n\n原始 FASTQ 与大型中间文件保留在服务器。</div><p class="muted">设计稿未连接服务器，本次不会传输真实文件。</p>`)}
function artifact(i){const contents=['gene_id\tcontrol_01\tcontrol_02\ttreatment_01\ttreatment_02\nENSG_DEMO_001\t128\t135\t264\t278\nENSG_DEMO_002\t562\t548\t201\t189','gene_id\tlog2FoldChange\tpadj\nENSG_DEMO_001\t1.04\t0.0021\nENSG_DEMO_002\t-1.50\t0.0008','QC report · DEMO-0067\nSamples: 4\nReads passed QC: 96.8%\nAlignment rate: 92.4%\nStatus: PASS',JSON.stringify({dataset:'DEMO-0067',pipeline:'gpsa-rnaseq@1.2',reference:'GRCh38',status:'succeeded',demo:true},null,2)];modal('产物预览 · 示例',`<p class="muted">以下为模拟内容，用于展示产物查看方式。</p><pre class="code">${esc(contents[i])}</pre>`)}
function dataContract(){modal('用于后续建库的数据契约',`<div class="code">dataset_id       数据集唯一标识\nsource_accession 来源数据编号\norganism         研究对象\nperturbed_gene   扰动基因\nperturbation     扰动方式\nsample_groups    样本与分组\npipeline_version 流程版本\noutput_files     产物路径与校验值\nreview_decision  人工纳入结论\nrun_provenance   执行与重试历史</div><p class="muted">统一的元数据与结果契约让数据库界面与预处理流程可以分别迭代。</p>`)}
function exportManifest(){let payload={demo:true,project:projects[st.project].name,workflow:'gpsa-rnaseq@1.2',datasets:[{id:'DEMO-0067',files:['expression_matrix.tsv','differential_expression.tsv','qc_report.html','run_manifest.json']}],note:'DBA 设计稿示例，不包含真实分析数据'};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='dba_demo_manifest.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已导出演示产物清单')}
st.page='overview';render();
</script></body></html>
