<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 310" role="img" aria-label="A job retries only network failures and everything else waits for a person" font-size="11.5"><rect width="760" height="310" fill="#ffffff"/><defs><marker id="st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4b8b0"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2a37">A job retries only network failures; everything else waits for a person</text><g fill="none" stroke="#b4b8b0" stroke-width="1.25"><path d="M160 102H177" marker-end="url(#st-arrow)"></path><path d="M301 102H318" marker-end="url(#st-arrow)"></path><path d="M442 102H459" marker-end="url(#st-arrow)"></path><path d="M583 102H600" marker-end="url(#st-arrow)"></path><path d="M360 126V164H239V200" marker-end="url(#st-arrow)"></path><path d="M400 126V180H521V200" marker-end="url(#st-arrow)"></path><path d="M164 224H24V102H36" marker-end="url(#st-arrow)"></path><path d="M596 212H736V58H98V78" marker-end="url(#st-arrow)" stroke-dasharray="4 4"></path></g><g><rect x="36" y="78" width="124" height="48" rx="8" fill="none" fill-opacity="1" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="98" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">queued</text></g><g><rect x="177" y="78" width="124" height="48" rx="8" fill="none" fill-opacity="1" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="239" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">starting</text></g><g><rect x="318" y="78" width="124" height="48" rx="8" fill="none" fill-opacity="1" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="380" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">running</text></g><g><rect x="459" y="78" width="124" height="48" rx="8" fill="none" fill-opacity="1" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="521" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">syncing</text></g><g><rect x="600" y="78" width="124" height="48" rx="8" fill="#22a05b" fill-opacity="0.14" stroke="#22a05b" stroke-width="2"></rect><text x="662" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">succeeded</text></g><g><rect x="164" y="200" width="150" height="48" rx="8" fill="#2f6fe4" fill-opacity="0.12" stroke="#2f6fe4" stroke-width="2"></rect><text x="239" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">retry wait</text></g><g><rect x="446" y="200" width="150" height="48" rx="8" fill="#f0a224" fill-opacity="0.14" stroke="#f0a224" stroke-width="2"></rect><text x="521" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">needs help</text></g><text x="231" y="190" text-anchor="end" fill="#6b7280">network error, attempt within limit</text><text x="604" y="228" fill="#6b7280">any other failure</text><text x="239" y="268" text-anchor="middle" fill="#6b7280">re-queued after 10 × 2ⁿ s, at most 300 s</text><text x="400" y="52" text-anchor="middle" fill="#6b7280">a person fixes the cause and resumes (to queued or running)</text><text x="36" y="296" fill="#6b7280">An SSH error while starting, running or syncing keeps the state and waits; past the retry limit the job also goes to needs help.</text></svg>
