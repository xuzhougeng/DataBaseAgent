<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 468" role="img" aria-label="One binary orchestrates and only the job on the server runs continuously" font-size="11.5"><rect width="760" height="468" fill="#ffffff"/><defs><marker id="ar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4b8b0"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2a37">One binary orchestrates; only the job on the server runs continuously</text><g><rect x="24" y="52" width="712" height="88" rx="8" fill="#eef0ec" stroke="#d9dcd6"></rect><text x="40" y="72" font-size="11.5" font-weight="600" fill="#6b7280">Desktop shell: Wails v3 over the system web view</text><rect x="36" y="84" width="688" height="40" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="380" y="108" text-anchor="middle" font-size="13" fill="#1f2a37">Nine pages of static HTML, CSS and JavaScript embedded in the executable</text></g><g fill="none" stroke="#b4b8b0" stroke-width="1.25"><path d="M380 124V172" marker-start="url(#ar-arrow)" marker-end="url(#ar-arrow)"></path></g><text x="392" y="152" fill="#6b7280">JSON API on 127.0.0.1; also serves the browser preview</text><g><rect x="24" y="172" width="712" height="120" rx="8" fill="none" stroke="#d9dcd6"></rect><text x="40" y="192" font-size="11.5" font-weight="600" fill="#6b7280">Go service: one process, one JSON file, no daemon</text></g><g><rect x="36" y="204" width="124" height="72" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="98" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">Store</text><text x="98" y="248" text-anchor="middle" fill="#1f2a37">workbench.json</text><text x="98" y="264" text-anchor="middle" fill="#1f2a37">atomic, rollback</text></g><g><rect x="177" y="204" width="124" height="72" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="239" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">Discovery</text><text x="239" y="248" text-anchor="middle" fill="#1f2a37">paging, dedup</text><text x="239" y="264" text-anchor="middle" fill="#1f2a37">search history</text></g><g><rect x="318" y="204" width="124" height="72" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="380" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">Agent loop</text><text x="380" y="248" text-anchor="middle" fill="#1f2a37">5 personas</text><text x="380" y="264" text-anchor="middle" fill="#1f2a37">read-only tools</text></g><g><rect x="459" y="204" width="124" height="72" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="521" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">Scheduler</text><text x="521" y="248" text-anchor="middle" fill="#1f2a37">tick and quotas</text><text x="521" y="264" text-anchor="middle" fill="#1f2a37">bounded retry</text></g><g><rect x="600" y="204" width="124" height="72" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="662" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">SSH executor</text><text x="662" y="248" text-anchor="middle" fill="#1f2a37">probe, start</text><text x="662" y="264" text-anchor="middle" fill="#1f2a37">poll, sync</text></g><g fill="none" stroke="#b4b8b0" stroke-width="1.25"><path d="M583 240H600" marker-end="url(#ar-arrow)"></path><path d="M239 276V308H142V356" marker-end="url(#ar-arrow)"></path><path d="M380 276V356" marker-end="url(#ar-arrow)"></path><path d="M662 276V308H618V356" marker-end="url(#ar-arrow)"></path></g><text x="190.5" y="303" text-anchor="middle" fill="#6b7280">HTTPS</text><text x="388" y="314" fill="#6b7280">3 protocols, keys from env</text><text x="610" y="345" text-anchor="end" fill="#6b7280">system ssh, strict host keys</text><g><rect x="24" y="324" width="712" height="120" rx="8" fill="none" stroke="#d9dcd6" stroke-dasharray="4 4"></rect><text x="238" y="344" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b7280">Outside the workbench</text></g><g><rect x="36" y="356" width="212" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="142" y="380" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">Literature and data APIs</text><text x="142" y="400" text-anchor="middle" fill="#1f2a37">Europe PMC REST</text><text x="142" y="416" text-anchor="middle" fill="#1f2a37">Entrez: PubMed and GEO</text></g><g><rect x="274" y="356" width="212" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="380" y="380" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">Model endpoints</text><text x="380" y="400" text-anchor="middle" fill="#1f2a37">OpenAI-compatible, Anthropic,</text><text x="380" y="416" text-anchor="middle" fill="#1f2a37">Gemini; local models included</text></g><g><rect x="512" y="356" width="212" height="72" rx="8" fill="#2f6fe4" fill-opacity="0.12" stroke="#2f6fe4" stroke-width="2"></rect><text x="618" y="380" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">The user's Linux server</text><text x="618" y="400" text-anchor="middle" fill="#1f2a37">nohup job per attempt</text><text x="618" y="416" text-anchor="middle" fill="#1f2a37">run.log, exitcode, outputs</text></g></svg>
