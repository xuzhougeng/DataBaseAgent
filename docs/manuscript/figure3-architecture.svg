<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 468" role="img" aria-label="One binary orchestrates and only the job on the server runs continuously" font-size="11.5"><rect width="760" height="468" fill="#ffffff"/><defs><marker id="ar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4b8b0"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2a37">One binary orchestrates; only the job on the server runs continuously</text><g><rect x="24" y="52" width="712" height="88" rx="8" fill="#eef0ec" stroke="#d9dcd6"></rect><text x="40" y="72" font-size="11.5" font-weight="600" fill="#6b7280">Desktop shell: Wails v3 over the system web view</text><rect x="36" y="84" width="688" height="40" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="380" y="103" text-anchor="middle" font-size="13" fill="#1f2a37">Thirteen pages of static HTML, CSS and JavaScript embedded in the executable;</text><text x="380" y="117" text-anchor="middle" font-size="11" fill="#6b7280">one conversation per project; the generated site previewed in a sandboxed frame</text></g><g fill="none" stroke="#b4b8b0" stroke-width="1.25"><path d="M380 124V172" marker-start="url(#ar-arrow)" marker-end="url(#ar-arrow)"></path></g><text x="392" y="152" fill="#6b7280">JSON API on 127.0.0.1; also serves the browser preview</text><g><rect x="24" y="172" width="712" height="124" rx="8" fill="none" stroke="#d9dcd6"></rect><text x="40" y="192" font-size="11.5" font-weight="600" fill="#6b7280">Go service: one process, one JSON file, no daemon</text></g><g><rect x="36" y="204" width="94" height="80" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="83" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">Store</text><text x="83" y="245" text-anchor="middle" font-size="10" fill="#1f2a37">workbench.json</text><text x="83" y="259" text-anchor="middle" font-size="10" fill="#1f2a37">atomic, rollback</text></g><g><rect x="135" y="204" width="94" height="80" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="182" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">Discovery</text><text x="182" y="245" text-anchor="middle" font-size="10" fill="#1f2a37">paging, dedup</text><text x="182" y="259" text-anchor="middle" font-size="10" fill="#1f2a37">search history</text></g><g><rect x="234" y="204" width="94" height="80" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="281" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">Agent loop</text><text x="281" y="245" text-anchor="middle" font-size="10" fill="#1f2a37">1 assistant,</text><text x="281" y="259" text-anchor="middle" font-size="10" fill="#1f2a37">4 specialists;</text><text x="281" y="273" text-anchor="middle" font-size="10" fill="#1f2a37">validated commands</text></g><g><rect x="333" y="204" width="94" height="80" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="380" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">Skills + site</text><text x="380" y="245" text-anchor="middle" font-size="10" fill="#1f2a37">SKILL.md catalogue</text><text x="380" y="259" text-anchor="middle" font-size="10" fill="#1f2a37">one-file static site</text><text x="380" y="273" text-anchor="middle" font-size="10" fill="#1f2a37">template snapshot</text></g><g><rect x="432" y="204" width="94" height="80" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="479" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">MCP client</text><text x="479" y="245" text-anchor="middle" font-size="10" fill="#1f2a37">HTTP or stdio</text><text x="479" y="259" text-anchor="middle" font-size="10" fill="#1f2a37">token in keychain</text><text x="479" y="273" text-anchor="middle" font-size="10" fill="#1f2a37">assistant only</text></g><g><rect x="531" y="204" width="94" height="80" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="578" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">Scheduler</text><text x="578" y="245" text-anchor="middle" font-size="10" fill="#1f2a37">tick and quotas</text><text x="578" y="259" text-anchor="middle" font-size="10" fill="#1f2a37">bounded retry</text></g><g><rect x="630" y="204" width="94" height="80" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="677" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">SSH executor</text><text x="677" y="245" text-anchor="middle" font-size="10" fill="#1f2a37">probe, start</text><text x="677" y="259" text-anchor="middle" font-size="10" fill="#1f2a37">poll, sync</text></g><g fill="none" stroke="#b4b8b0" stroke-width="1.25"><path d="M182 284V312H116V356" marker-end="url(#ar-arrow)"></path><path d="M281 284V312H292V356" marker-end="url(#ar-arrow)"></path><path d="M479 284V312H468V356" marker-end="url(#ar-arrow)"></path><path d="M677 284V312H644V356" marker-end="url(#ar-arrow)"></path></g><text x="122" y="336" font-size="10" fill="#6b7280">HTTPS</text><text x="298" y="340" font-size="10" fill="#6b7280">3 protocols; keys in the keychain</text><text x="474" y="331" font-size="10" fill="#6b7280">bearer token; no redirects</text><text x="638" y="349" text-anchor="end" font-size="10" fill="#6b7280">system ssh, strict host keys</text><g><rect x="24" y="324" width="712" height="120" rx="8" fill="none" stroke="#d9dcd6" stroke-dasharray="4 4"></rect><text x="40" y="439" font-size="11.5" font-weight="600" fill="#6b7280">Outside the workbench</text></g><g><rect x="36" y="356" width="160" height="72" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="116" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">Literature, data APIs</text><text x="116" y="398" text-anchor="middle" font-size="10.5" fill="#1f2a37">Europe PMC REST</text><text x="116" y="412" text-anchor="middle" font-size="10.5" fill="#1f2a37">Entrez: PubMed and GEO</text></g><g><rect x="212" y="356" width="160" height="72" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="292" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">Model endpoints</text><text x="292" y="396" text-anchor="middle" font-size="10.5" fill="#1f2a37">OpenAI-compatible,</text><text x="292" y="408" text-anchor="middle" font-size="10.5" fill="#1f2a37">Anthropic, Gemini;</text><text x="292" y="420" text-anchor="middle" font-size="10.5" fill="#1f2a37">local models included</text></g><g><rect x="388" y="356" width="160" height="72" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="468" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">MCP servers</text><text x="468" y="396" text-anchor="middle" font-size="10.5" fill="#1f2a37">GitHub, Cloudflare (hosted)</text><text x="468" y="408" text-anchor="middle" font-size="10.5" fill="#1f2a37">or a local executable;</text><text x="468" y="420" text-anchor="middle" font-size="10.5" fill="#1f2a37">publishing on instruction</text></g><g><rect x="564" y="356" width="160" height="72" rx="8" fill="#2f6fe4" fill-opacity="0.12" stroke="#2f6fe4" stroke-width="2"></rect><text x="644" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">The user's Linux server</text><text x="644" y="398" text-anchor="middle" font-size="10.5" fill="#1f2a37">nohup job per attempt</text><text x="644" y="412" text-anchor="middle" font-size="10.5" fill="#1f2a37">run.log, exitcode, outputs</text></g></svg>
