<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 352" role="img" aria-label="Six stages build the repository and three end in a human decision" font-size="11.5"><rect width="760" height="352" fill="#ffffff"/><defs><marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4b8b0"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2a37">Six stages build the repository; three end in a human decision</text><g fill="none" stroke="#b4b8b0" stroke-width="1.25"><path d="M252 112H278" marker-end="url(#wf-arrow)"></path><path d="M490 112H516" marker-end="url(#wf-arrow)"></path><path d="M622 160V180H146V200" marker-end="url(#wf-arrow)"></path><path d="M252 248H278" marker-end="url(#wf-arrow)"></path><path d="M490 248H516" marker-end="url(#wf-arrow)"></path><path d="M622 296V322H22V112H40" marker-end="url(#wf-arrow)" stroke-dasharray="4 4"></path></g><g><rect x="40" y="64" width="212" height="96" rx="8" fill="none" fill-opacity="1" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="146" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">1 Define</text><text x="146" y="110" text-anchor="middle" fill="#1f2a37">Topic, organism, assay</text><text x="146" y="126" text-anchor="middle" fill="#1f2a37">Inclusion criteria as prose</text></g><g><rect x="278" y="64" width="212" height="96" rx="8" fill="none" fill-opacity="1" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="384" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">2 Search</text><text x="384" y="110" text-anchor="middle" fill="#1f2a37">Europe PMC, PubMed, GEO</text><text x="384" y="126" text-anchor="middle" fill="#1f2a37">or JSON import; merge, dedup</text></g><g><rect x="516" y="64" width="212" height="96" rx="8" fill="#2f6fe4" fill-opacity="0.12" stroke="#2f6fe4" stroke-width="2"></rect><text x="622" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">3 Review</text><text x="622" y="110" text-anchor="middle" fill="#1f2a37">Agent suggests with evidence</text><text x="622" y="126" text-anchor="middle" fill="#1f2a37">Person accepts with a reason</text><rect x="582" y="134" width="80" height="18" rx="9" fill="#2f6fe4" fill-opacity="0.18"></rect><text x="622" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2a37">human gate</text></g><g><rect x="40" y="200" width="212" height="96" rx="8" fill="#2f6fe4" fill-opacity="0.12" stroke="#2f6fe4" stroke-width="2"></rect><text x="146" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">4 Pipeline</text><text x="146" y="246" text-anchor="middle" fill="#1f2a37">Shell steps, DBA_* contract</text><text x="146" y="262" text-anchor="middle" fill="#1f2a37">Lock a version</text><rect x="106" y="270" width="80" height="18" rx="9" fill="#2f6fe4" fill-opacity="0.18"></rect><text x="146" y="283" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2a37">human gate</text></g><g><rect x="278" y="200" width="212" height="96" rx="8" fill="#2f6fe4" fill-opacity="0.12" stroke="#2f6fe4" stroke-width="2"></rect><text x="384" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">5 Run</text><text x="384" y="246" text-anchor="middle" fill="#1f2a37">SSH, quotas, bounded retry</text><text x="384" y="262" text-anchor="middle" fill="#1f2a37">Else: needs help, then resume</text><rect x="344" y="270" width="80" height="18" rx="9" fill="#2f6fe4" fill-opacity="0.18"></rect><text x="384" y="283" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2a37">human gate</text></g><g><rect x="516" y="200" width="212" height="96" rx="8" fill="none" fill-opacity="1" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="622" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">6 Archive</text><text x="622" y="246" text-anchor="middle" fill="#1f2a37">SHA-256 twice, resumed stream</text><text x="622" y="262" text-anchor="middle" fill="#1f2a37">Manifest per job</text></g><text x="384" y="175" text-anchor="middle" fill="#6b7280">accepted candidates only</text><text x="371" y="316" text-anchor="middle" fill="#6b7280">re-entered: a new search, a new pipeline version, a resumed job</text></svg>
