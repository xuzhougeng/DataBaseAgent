<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 516" role="img" aria-label="Two workflows build a repository; the tinted stages end in a decision the application never takes alone" font-size="11.5"><rect width="760" height="516" fill="#ffffff"/><defs><marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4b8b0"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2a37">Two workflows build a repository; the tinted stages wait for a person</text><text x="40" y="55" font-size="11" font-weight="600" fill="#6b7280">STATIC PROJECT: PUBLISH WHAT YOU HAVE</text><text x="40" y="217" font-size="11" font-weight="600" fill="#6b7280">COLLECTING PROJECT: COLLECT WHAT YOU NEED</text><g fill="none" stroke="#b4b8b0" stroke-width="1.25"><path d="M168 118H180" marker-end="url(#wf-arrow)"></path><path d="M308 118H320" marker-end="url(#wf-arrow)"></path><path d="M448 118H460" marker-end="url(#wf-arrow)"></path><path d="M588 118H600" marker-end="url(#wf-arrow)"></path><path d="M252 274H278" marker-end="url(#wf-arrow)"></path><path d="M490 274H516" marker-end="url(#wf-arrow)"></path><path d="M622 322V342H146V362" marker-end="url(#wf-arrow)"></path><path d="M252 410H278" marker-end="url(#wf-arrow)"></path><path d="M490 410H516" marker-end="url(#wf-arrow)"></path><path d="M622 458V484H22V274H40" marker-end="url(#wf-arrow)" stroke-dasharray="4 4"></path><path d="M728 410H746V186H244V172" marker-end="url(#wf-arrow)" stroke-dasharray="4 4"></path></g><g><rect x="40" y="64" width="128" height="108" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="104" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">S1 Inspect data</text><text x="104" y="108" text-anchor="middle" font-size="10.5" fill="#1f2a37">CSV, TSV or JSON</text><text x="104" y="122" text-anchor="middle" font-size="10.5" fill="#1f2a37">schema and summaries</text><text x="104" y="136" text-anchor="middle" font-size="10.5" fill="#1f2a37">saved input</text></g><g><rect x="180" y="64" width="128" height="108" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="244" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">S2 Read skill</text><text x="244" y="108" text-anchor="middle" font-size="10.5" fill="#1f2a37">domain knowledge</text><text x="244" y="122" text-anchor="middle" font-size="10.5" fill="#1f2a37">interpretation rules</text><text x="244" y="136" text-anchor="middle" font-size="10.5" fill="#1f2a37">design guidance</text></g><g><rect x="320" y="64" width="128" height="108" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="384" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">S3 Agent builds</text><text x="384" y="108" text-anchor="middle" font-size="10.5" fill="#1f2a37">HTML / CSS / JS</text><text x="384" y="122" text-anchor="middle" font-size="10.5" fill="#1f2a37">real data embedded</text><text x="384" y="136" text-anchor="middle" font-size="10.5" fill="#1f2a37">optional templates</text></g><g><rect x="460" y="64" width="128" height="108" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="524" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">S4 Preview / revise</text><text x="524" y="108" text-anchor="middle" font-size="10.5" fill="#1f2a37">sandboxed frame;</text><text x="524" y="122" text-anchor="middle" font-size="10.5" fill="#1f2a37">export the</text><text x="524" y="136" text-anchor="middle" font-size="10.5" fill="#1f2a37">self-contained file</text></g><g><rect x="600" y="64" width="128" height="108" rx="8" fill="#2f6fe4" fill-opacity="0.12" stroke="#2f6fe4" stroke-width="2"></rect><text x="664" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">S5 Publish</text><text x="664" y="108" text-anchor="middle" font-size="10.5" fill="#1f2a37">GitHub or Cloudflare</text><text x="664" y="122" text-anchor="middle" font-size="10.5" fill="#1f2a37">Pages via the provider's</text><text x="664" y="136" text-anchor="middle" font-size="10.5" fill="#1f2a37">MCP server, user's token</text><rect x="620" y="144" width="88" height="18" rx="9" fill="#2f6fe4" fill-opacity="0.18"></rect><text x="664" y="157" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2a37">on instruction</text></g><g><rect x="40" y="226" width="212" height="96" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="146" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">1 Define</text><text x="146" y="272" text-anchor="middle" fill="#1f2a37">Topic, organism, assay</text><text x="146" y="288" text-anchor="middle" fill="#1f2a37">Inclusion criteria as prose</text></g><g><rect x="278" y="226" width="212" height="96" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="384" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">2 Search</text><text x="384" y="272" text-anchor="middle" fill="#1f2a37">Europe PMC, PubMed, GEO</text><text x="384" y="288" text-anchor="middle" fill="#1f2a37">or JSON import; merge, dedup</text></g><g><rect x="516" y="226" width="212" height="96" rx="8" fill="#2f6fe4" fill-opacity="0.12" stroke="#2f6fe4" stroke-width="2"></rect><text x="622" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">3 Review</text><text x="622" y="272" text-anchor="middle" fill="#1f2a37">Agent suggests with evidence</text><text x="622" y="288" text-anchor="middle" fill="#1f2a37">Accept with a reason, by author</text><rect x="582" y="296" width="80" height="18" rx="9" fill="#2f6fe4" fill-opacity="0.18"></rect><text x="622" y="309" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2a37">gate</text></g><g><rect x="40" y="362" width="212" height="96" rx="8" fill="#2f6fe4" fill-opacity="0.12" stroke="#2f6fe4" stroke-width="2"></rect><text x="146" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">4 Pipeline</text><text x="146" y="408" text-anchor="middle" fill="#1f2a37">Shell steps, DBA_* contract</text><text x="146" y="424" text-anchor="middle" fill="#1f2a37">Lock a version</text><rect x="106" y="432" width="80" height="18" rx="9" fill="#2f6fe4" fill-opacity="0.18"></rect><text x="146" y="445" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2a37">gate</text></g><g><rect x="278" y="362" width="212" height="96" rx="8" fill="#2f6fe4" fill-opacity="0.12" stroke="#2f6fe4" stroke-width="2"></rect><text x="384" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">5 Run</text><text x="384" y="408" text-anchor="middle" fill="#1f2a37">SSH, quotas, bounded retry</text><text x="384" y="424" text-anchor="middle" fill="#1f2a37">Else: needs help, then resume</text><rect x="344" y="432" width="80" height="18" rx="9" fill="#2f6fe4" fill-opacity="0.18"></rect><text x="384" y="445" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2a37">gate</text></g><g><rect x="516" y="362" width="212" height="96" rx="8" fill="none" stroke="#b4b8b0" stroke-width="1.25"></rect><text x="622" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a37">6 Archive</text><text x="622" y="408" text-anchor="middle" fill="#1f2a37">SHA-256 twice, resumed stream</text><text x="622" y="424" text-anchor="middle" fill="#1f2a37">Manifest per job</text></g><text x="384" y="337" text-anchor="middle" fill="#6b7280">accepted candidates only</text><text x="371" y="478" text-anchor="middle" fill="#6b7280">re-entered: a new search, a new pipeline version, a resumed job</text><text x="736" y="199" text-anchor="end" font-size="10.5" fill="#6b7280">an archived table into a static project: export and import by hand today</text></svg>
